<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Latihan Paste Rapi</title>
<style>body{font:16px/1.6 system-ui;max-width:760px;margin:50px auto;padding:0 24px;background:#f5f7fb;color:#263447}label{display:block;margin:24px 0 8px;font-weight:600}input,textarea,[contenteditable]{font:inherit;box-sizing:border-box;width:100%;border:1px solid #ced9e9;background:white;border-radius:10px;padding:14px}textarea,[contenteditable]{min-height:140px;white-space:pre-wrap}small{color:#718096}</style>
</head><body><h1>Latihan Paste Rapi</h1><p>Klik salah satu kolom, buka ekstensi, masukkan teks, lalu pilih <b>Mulai mengetik</b>.</p><small>Halaman ini hanya untuk mencoba input dan tidak mengirim data.</small>
<label for="single">Kolom satu baris</label><input id="single" placeholder="Coba satu kalimat">
<label for="multi">Kolom beberapa paragraf</label><textarea id="multi" placeholder="Coba paragraf, daftar, dan emoji"></textarea>
<label id="rich-label">Editor contenteditable</label><div contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="rich-label"></div>
</body></html>
